name: Generates Pong SVGs every hour

on:
  schedule:
      - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  generate-pong-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pong SVGs
        uses: st1vms/PongSVG@main
        with:
          winning-score: 1

      - name: Move generated SVGs
        run: |
            mkdir -p examples
            mv pong_light.svg examples/pong_light.svg
            mv pong_dark.svg examples/pong_dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push SVGs
        run: |
          git add examples/pong_light.svg examples/pong_dark.svg
          git commit -m "Update Pong SVGs"
          git push
